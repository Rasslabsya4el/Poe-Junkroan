name: Python environment
description: >
  Install uv, make a Python 3.12 virtual environment in .venv with the project and its dev extras
  (`pip install -e ".[dev]"`), and put .venv/bin first on the PATH, so later steps run `python` from it.
  Run after actions/checkout.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.6"
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Make .venv with the project and its dev extras
      shell: bash
      run: |
        uv venv .venv --python 3.12
        uv pip install --python .venv/bin/python -e ".[dev]"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
