name: CI

# The suite without the `slow` tests (`-m "not slow"`; the `pob` tests run, on the pinned PoB built by
# .github/actions/pob) in 8 shards on GitHub's hosted Linux runners; a shard runs 4 pytest processes at once. Tests are
# split in whole groups (a module, or a module and one value of a module-scoped parametrized fixture). See docs/ci.md.
# The shard options come from the plugin tests/shard_support.py, registered on the command line (`-p tests.shard_support`).
# `CI summary` is the one check to wait for: green only when every shard passed.
# Linux only. This workflow never runs on the self-hosted server: a public repository's pull requests must not reach it.

on:
  pull_request:
  workflow_dispatch:  # the way to test `main` (or any ref) on demand

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/python
      - uses: ./.github/actions/pob
      - name: Run shard ${{ matrix.shard }} of 8 on 4 processes
        run: >
          python .github/scripts/run_shard.py
          --shard ${{ matrix.shard }}/8 --procs 4 --out out --timeout 25
          -- -p tests.shard_support -p no:cacheprovider -q --durations=10 -m "not slow"
          --shard-durations tests/shard_durations.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: results-${{ matrix.shard }}
          overwrite: true  # a re-run of one failed shard replaces its earlier result
          path: out/
          if-no-files-found: warn

  summary:
    name: CI summary
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: results-*
          path: results
      - name: Totals, skips, and the shard check
        run: >
          python3 .github/scripts/ci_summary.py results --shards 8
          --min-tests 1000
          --forbid-skip "PoB runtime" --forbid-skip "pinned PoB" --forbid-skip "PoB skill"
          --forbid-skip "PoB source data" --forbid-skip "PoB-needing tests are skipped"
          --job-result "${{ needs.test.result }}" --merged-durations merged/shard_durations.json
      - name: Keep the measured seconds (commit them as tests/shard_durations.json to rebalance)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shard-durations
          overwrite: true
          path: merged/shard_durations.json
          if-no-files-found: ignore
